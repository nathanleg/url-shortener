<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://theshirtlessdudes-api.pythonvibecoder.workers.dev; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';">
<title>Nate's URL Shortener</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 560px;
    margin: 60px auto;
    padding: 0 20px;
    background: #f7f7f8;
    color: #1a1a1a;
  }
  h1 { font-size: 22px; margin-bottom: 20px; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type="text"], input[type="url"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
  }
  .row { display: flex; gap: 8px; margin-bottom: 20px; flex: 0; }
  .row input[type="text"] { flex: 0 0 140px; }
  button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #1d4ed8; }
  .error { color: #d33; font-size: 14px; margin: -4px 0 16px; min-height: 1em; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    background: white;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .top { display: flex; align-items: center; gap: 10px; }
  .short { font-weight: 600; color: #2563eb; text-decoration: none; }
  .target { color: #888; font-size: 13px; word-break: break-all; margin-top: 4px; }
  .meta { color: #999; font-size: 12px; margin-top: 4px; }
  li button.delete {
    margin-left: auto;
    background: transparent;
    color: #d33;
    padding: 4px 8px;
    font-size: 18px;
    line-height: 1;
  }
  li button.delete:hover { background: #fee; }
  .empty { color: #888; text-align: center; padding: 20px 0; box-shadow: none; background: none; }
  .copy { background: #eee; color: #333; padding: 6px 10px; font-size: 13px; }
  .copy:hover { background: #ddd; }
  .setup {
    background: #fff8e1;
    border: 1px solid #f0d878;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  #login-gate form { margin-bottom: 8px; }
  #login-gate input[type="password"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
  }
</style>
</head>
<body>
  <h1>Nate's URL Shortener</h1>
  <div class="setup" id="setup-notice" hidden>
    API backend isn't configured yet. Edit <code>config.js</code> with your deployed Worker URL. See <code>worker/README.md</code>.
  </div>

  <div id="login-gate">
    <form id="login-form">
      <input type="password" id="password-input" placeholder="Password" required autofocus>
      <button type="submit">Unlock</button>
    </form>
    <div class="error" id="login-error"></div>
  </div>

  <div id="app" hidden>
    <form id="add-form">
      <input type="url" id="url-input" placeholder="https://example.com/long/url" required>
      <div class="row">
        <input type="text" id="code-input" placeholder="custom code (optional)">
      </div>
      <button type="submit">Shorten</button>
    </form>
    <div class="error" id="error"></div>
    <ul id="link-list"></ul>
  </div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
