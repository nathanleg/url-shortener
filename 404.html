<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting…</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 480px;
    margin: 100px auto;
    padding: 0 20px;
    background: #f7f7f8;
    color: #1a1a1a;
    text-align: center;
  }
  a { color: #2563eb; }
</style>
</head>
<body>
  <p id="message">Redirecting…</p>

<script src="config.js"></script>
<script>
const code = location.pathname.replace(/^\/+/, '').replace(/\/+$/, '');
const messageEl = document.getElementById('message');

async function go() {
  if (!code) {
    location.replace('/');
    return;
  }
  try {
    const res = await fetch(`${API_BASE}/lookup/${encodeURIComponent(code)}`);
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    location.replace(data.url);
  } catch (e) {
    messageEl.innerHTML = `No link found for "<strong>${code}</strong>". <a href="/">Go home</a>`;
  }
}

go();
</script>
</body>
</html>
